services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voucher
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/voucher
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
